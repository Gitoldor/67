<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Shorts</title>


  <style>

    :root {

      --bg-color: #0f0f0f;
      --card-bg: #212121;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-red: #ff0000;

      --pill-bg:
        rgba(255, 255, 255, 0.2);

      --pill-active-bg:
        #ffffff;

      --pill-active-text:
        #0f0f0f;

    }


    * {

      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      user-select: none;

    }


    body,
    html {

      height: 100%;
      width: 100%;

      background-color:
        #000000;

      color:
        var(--text-main);

      overflow:
        hidden;

      display:
        flex;

      justify-content:
        center;

    }


    .app-container {

      width:
        100%;

      max-width:
        412px;

      height:
        100vh;

      background-color:
        #000000;

      position:
        relative;

      display:
        flex;

      flex-direction:
        column;

    }


    /* =========================================================
       TOP NAVIGATION
    ========================================================= */

    .carousel-container {

      position:
        absolute;

      top:
        0;

      left:
        0;

      right:
        0;

      z-index:
        50;

      display:
        flex;

      align-items:
        center;

      padding:
        12px 0;

      background:

        linear-gradient(

          to bottom,

          rgba(0, 0, 0, 0.8) 0%,

          rgba(0, 0, 0, 0) 100%

        );

      pointer-events:
        auto;

    }


    .sticky-compass {

      position:
        sticky;

      left:
        0;

      z-index:
        10;

      padding:
        0 8px 0 12px;

      display:
        flex;

      align-items:
        center;

    }


    .compass-btn {

      background-color:
        var(--pill-bg);

      border-radius:
        8px;

      width:
        34px;

      height:
        32px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      cursor:
        pointer;

      backdrop-filter:
        blur(8px);

    }


    .category-scroll {

      display:
        flex;

      gap:
        8px;

      overflow-x:
        auto;

      padding-right:
        12px;

      scrollbar-width:
        none;

    }


    .category-scroll::-webkit-scrollbar {

      display:
        none;

    }


    .nav-chip {

      background-color:
        var(--pill-bg);

      color:
        var(--text-main);

      padding:
        6px 12px;

      border-radius:
        8px;

      font-size:
        13px;

      font-weight:
        500;

      white-space:
        nowrap;

      cursor:
        pointer;

      display:
        flex;

      align-items:
        center;

      gap:
        6px;

      flex-shrink:
        0;

      text-decoration:
        none;

      backdrop-filter:
        blur(8px);

    }


    .nav-chip.active {

      background-color:
        var(--pill-active-bg);

      color:
        var(--pill-active-text);

    }


    .nav-chip svg {

      width:
        16px;

      height:
        16px;

    }


    /* =========================================================
       VIRTUAL SCROLL VIEWPORT
    ========================================================= */

    .shorts-viewport {

      height:
        100%;

      width:
        100%;

      overflow-y:
        scroll;

      scroll-snap-type:
        y mandatory;

      scrollbar-width:
        none;

      overscroll-behavior-y:
        contain;

    }


    .shorts-viewport::-webkit-scrollbar {

      display:
        none;

    }


    /*
      These spacers represent Shorts
      that DO NOT exist in the DOM.
    */

    .virtual-spacer {

      width:
        100%;

      flex-shrink:
        0;

      pointer-events:
        none;

    }


    /* =========================================================
       ACTIVE SHORT

       ONLY ONE EXISTS.
    ========================================================= */

    .short-slide {

      height:
        100vh;

      width:
        100%;

      scroll-snap-align:
        start;

      scroll-snap-stop:
        always;

      position:
        relative;

      background-color:
        #000000;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      flex-shrink:
        0;

      overflow:
        hidden;

    }


    .short-embed-frame {

      width:
        100%;

      height:
        100%;

      border:
        none;

      pointer-events:
        auto;

      transform:
        scale(1.05);

    }


    /* =========================================================
       ACTIONS
    ========================================================= */

    .actions-bar {

      position:
        absolute;

      right:
        12px;

      bottom:
        80px;

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      gap:
        18px;

      z-index:
        20;

    }


    .action-btn {

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      gap:
        4px;

      background:
        none;

      border:
        none;

      color:
        #ffffff;

      font-size:
        11px;

      font-weight:
        500;

      cursor:
        pointer;

      text-decoration:
        none;

      -webkit-touch-callout:
        none;

    }


    .action-icon-wrapper {

      width:
        44px;

      height:
        44px;

      border-radius:
        50%;

      background:

        rgba(33, 33, 33, 0.6);

      backdrop-filter:
        blur(10px);

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .action-icon-wrapper svg {

      width:
        22px;

      height:
        22px;

      fill:
        #ffffff;

    }


    .save-btn.saved
    .action-icon-wrapper {

      background:
        #ffffff;

    }


    .save-btn.saved
    .action-icon-wrapper svg {

      fill:
        #0f0f0f;

    }


    /* =========================================================
       BOTTOM INFORMATION
    ========================================================= */

    .bottom-info {

      position:
        absolute;

      left:
        12px;

      bottom:
        24px;

      right:
        72px;

      z-index:
        20;

      display:
        flex;

      flex-direction:
        column;

      gap:
        10px;

      pointer-events:
        none;

    }


    .bottom-info * {

      pointer-events:
        auto;

    }


    .creator-profile {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

    }


    .creator-avatar {

      width:
        32px;

      height:
        32px;

      border-radius:
        50%;

      background-size:
        cover;

      background-position:
        center;

      border:

        1px solid
        rgba(255, 255, 255, 0.3);

    }


    .creator-handle {

      font-size:
        14px;

      font-weight:
        600;

      color:
        #ffffff;

    }


    .subscribe-btn {

      background-color:
        var(--accent-red);

      color:
        #ffffff;

      border:
        none;

      padding:
        6px 12px;

      border-radius:
        18px;

      font-weight:
        600;

      font-size:
        12px;

      cursor:
        pointer;

    }


    .short-caption {

      font-size:
        13px;

      line-height:
        1.35;

      color:
        #ffffff;

      display:
        -webkit-box;

      -webkit-line-clamp:
        2;

      -webkit-box-orient:
        vertical;

      overflow:
        hidden;

    }

  </style>

</head>


<body>

    <!-- ================================================
         VIRTUAL SHORTS VIEWPORT

         Initially EMPTY.
    ================================================= -->

    <main
      class="shorts-viewport"
      id="shortsViewport"
    ></main>

  <!-- ================================================
       DATA

       YOUR EXISTING FILE.
       UNCHANGED.
  ================================================= -->

  <script src="data.js"></script>


  <script>


    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const CONFIG = {

      viewportId:
        "shortsViewport",

      shortType:
        "shorts",

      deepLinkParameter:
        "id",

      activeStorageKey:
        "shorts2-active-id",

      indexStorageKey:
        "shorts2-active-index",

      orderStorageKey:
        "shorts2-feed-order",

      scrollSettleDelay:
        100,

      minimumSwipeDistance:
        50

    };


    /* =========================================================
       INDEXEDDB
    ========================================================= */

    const DB_NAME =
      "ShortsAppDB";


    const DB_VERSION =
      1;


    const STORE_NAME =
      "saved_shorts";


    function openDB() {

      return new Promise(

        (resolve, reject) => {

          const request =
            indexedDB.open(
              DB_NAME,
              DB_VERSION
            );


          request.onupgradeneeded =
            event => {

              const db =
                event.target.result;


              if (

                !db.objectStoreNames
                  .contains(STORE_NAME)

              ) {

                db.createObjectStore(

                  STORE_NAME,

                  {
                    keyPath: "id"
                  }

                );

              }

            };


          request.onsuccess =
            () => {

              resolve(
                request.result
              );

            };


          request.onerror =
            event => {

              reject(
                event.target.error
              );

            };

        }

      );

    }


    async function saveShortToDB(item) {

      const db =
        await openDB();


      return new Promise(

        (resolve, reject) => {

          const transaction =
            db.transaction(

              STORE_NAME,

              "readwrite"

            );


          const store =
            transaction.objectStore(
              STORE_NAME
            );


          const request =
            store.put({

              ...item,

              savedAt:
                Date.now()

            });


          request.onsuccess =
            () => resolve();


          request.onerror =
            event =>

              reject(
                event.target.error
              );

        }

      );

    }


    async function removeShortFromDB(id) {

      const db =
        await openDB();


      return new Promise(

        (resolve, reject) => {

          const transaction =
            db.transaction(

              STORE_NAME,

              "readwrite"

            );


          const store =
            transaction.objectStore(
              STORE_NAME
            );


          const request =
            store.delete(id);


          request.onsuccess =
            () => resolve();


          request.onerror =
            event =>

              reject(
                event.target.error
              );

        }

      );

    }


    async function isShortSaved(id) {

      const db =
        await openDB();


      return new Promise(

        resolve => {

          const transaction =
            db.transaction(

              STORE_NAME,

              "readonly"

            );


          const store =
            transaction.objectStore(
              STORE_NAME
            );


          const request =
            store.get(id);


          request.onsuccess =
            () =>

              resolve(
                !!request.result
              );


          request.onerror =
            () => resolve(false);

        }

      );

    }


    /* =========================================================
       APPLICATION STATE
    ========================================================= */

    let viewport =
      null;


    let feed =
      [];


    let currentIndex =
      0;


    let activeSlide =
      null;


    let activeIframe =
      null;


    let topSpacer =
      null;


    let bottomSpacer =
      null;


    let scrollTimer =
      null;


    let resizeTimer =
      null;


    let touchStartY =
      0;


    let isProgrammaticScroll =
      false;


    let isRendering =
      false;


    let lastViewId =
      null;


    let suspendedIndex =
      null;


    /* =========================================================
       DATA EXTRACTION

       data.js stays untouched.
    ========================================================= */

    function getShortsData() {

      if (
        typeof mediaData ===
        "undefined"
      ) {

        return [];

      }


      if (
        !Array.isArray(mediaData)
      ) {

        return [];

      }


      return mediaData.filter(

        item =>

          item

          &&

          item.type ===
          CONFIG.shortType

      );

    }


    /* =========================================================
       FREEZE FEED ORDER

       Prevents feed jumping around.
    ========================================================= */

    function getFrozenSessionFeed() {

      const shorts =
        getShortsData();


      if (!shorts.length) {

        return [];

      }


      /*
        Keep original data.js order.

        No unnecessary cloning
        of every object.
      */

      return shorts;

    }


    /* =========================================================
       DEEP LINK

       shorts2.html?id=s3
    ========================================================= */

    function getRequestedId() {

      try {

        const parameters =
          new URLSearchParams(
            window.location.search
          );


        return parameters.get(
          CONFIG.deepLinkParameter
        );

      }

      catch (error) {

        return null;

      }

    }


    /* =========================================================
       INITIAL INDEX
    ========================================================= */

    function getInitialIndex() {

      if (!feed.length) {

        return 0;

      }


      /*
        URL has highest priority.
      */

      const requestedId =
        getRequestedId();


      if (requestedId) {

        const requestedIndex =
          feed.findIndex(

            item =>

              item.id ===
              requestedId

          );


        if (
          requestedIndex >= 0
        ) {

          return requestedIndex;

        }

      }


      /*
        Restore active Short.
      */

      try {

        const savedId =
          sessionStorage.getItem(
            CONFIG.activeStorageKey
          );


        if (savedId) {

          const savedIndex =
            feed.findIndex(

              item =>

                item.id ===
                savedId

            );


          if (
            savedIndex >= 0
          ) {

            return savedIndex;

          }

        }

      }

      catch (error) {}


      return 0;

    }


    /* =========================================================
       VIEWPORT HEIGHT
    ========================================================= */

    function getViewportHeight() {

      return (

        viewport?.clientHeight

        ||

        window.innerHeight

        ||

        1

      );

    }


    /* =========================================================
       VIRTUAL SPACER
    ========================================================= */

    function createSpacer() {

      const spacer =
        document.createElement(
          "div"
        );


      spacer.className =
        "virtual-spacer";


      spacer.setAttribute(
        "aria-hidden",
        "true"
      );


      return spacer;

    }


    /* =========================================================
       UPDATE VIRTUAL SPACERS
    ========================================================= */

    function updateVirtualSpacers() {

      if (
        !topSpacer ||
        !bottomSpacer
      ) {
        return;
      }


      const height =
        getViewportHeight();


      /*
        Space representing all Shorts
        before the current Short.
      */

      topSpacer.style.height =

        (currentIndex * height)

        + "px";


      /*
        Space representing all Shorts
        after the current Short.
      */

      bottomSpacer.style.height =

        (
          Math.max(
            0,
            feed.length - currentIndex - 1
          )

          * height
        )

        + "px";

    }


    /* =========================================================
       YOUTUBE ID EXTRACTION
    ========================================================= */

    function extractYouTubeId(url) {

      if (!url) {
        return "";
      }


      try {

        const parsed =
          new URL(url);


        /* youtube.com/shorts/VIDEO_ID */

        if (
          parsed.pathname.includes("/shorts/")
        ) {

          return parsed.pathname
            .split("/shorts/")[1]
            .split("/")[0];

        }


        /* youtube.com/watch?v=VIDEO_ID */

        const videoId =
          parsed.searchParams.get("v");


        if (videoId) {

          return videoId;

        }


        /* youtu.be/VIDEO_ID */

        const parts =
          parsed.pathname
            .split("/")
            .filter(Boolean);


        return (
          parts[parts.length - 1]
          ||
          ""
        );

      }

      catch (error) {

        const parts =
          String(url)
            .split("?")[0]
            .split("#")[0]
            .split("/")
            .filter(Boolean);


        return (
          parts[parts.length - 1]
          ||
          ""
        );

      }

    }


    /* =========================================================
       EMBED URL

       autoplay = 0
       mute = 0

       The Short waits for the user
       to press YouTube's native play button.
    ========================================================= */

    function getEmbedURL(item) {

      const videoId =
        extractYouTubeId(item.url);


      if (!videoId) {
        return "";
      }


      const parameters =
        new URLSearchParams({

          autoplay: "0",

          mute: "0",

          loop: "1",

          playlist: videoId,

          controls: "1",

          modestbranding: "1",

          rel: "0",

          playsinline: "1"

        });


      return (

        "https://www.youtube.com/embed/"

        +

        encodeURIComponent(videoId)

        +

        "?"

        +

        parameters.toString()

      );

    }


    /* =========================================================
       HARD KILL OLD SHORT

       Completely removes:

       - Old Short
       - Old iframe
       - YouTube embed

       It does not remain in the DOM.
    ========================================================= */

    function destroyActiveShort() {

      const oldSlide =
        activeSlide;


      const oldIframe =
        activeIframe;


      activeSlide =
        null;


      activeIframe =
        null;


      /* Kill iframe first */

      if (oldIframe) {

        try {

          oldIframe.src =
            "about:blank";

        }

        catch (error) {}


        try {

          oldIframe.removeAttribute(
            "src"
          );

        }

        catch (error) {}


        try {

          oldIframe.remove();

        }

        catch (error) {}

      }


      /* Kill entire slide */

      if (oldSlide) {

        try {

          oldSlide.replaceChildren();

        }

        catch (error) {}


        try {

          oldSlide.remove();

        }

        catch (error) {}

      }


      /*
        Safety cleanup.

        Guarantees that no old
        Short remains in the DOM.
      */

      if (viewport) {

        const remainingSlides =
          viewport.querySelectorAll(
            ".short-slide"
          );


        remainingSlides.forEach(

          slide => {

            const iframe =
              slide.querySelector(
                "iframe"
              );


            if (iframe) {

              try {

                iframe.src =
                  "about:blank";

              }

              catch (error) {}


              try {

                iframe.remove();

              }

              catch (error) {}

            }


            try {

              slide.remove();

            }

            catch (error) {}

          }

        );

      }

    }


    /* =========================================================
       SAVE SESSION STATE
    ========================================================= */

    function saveCurrentState() {

      const item =
        feed[currentIndex];


      if (!item) {
        return;
      }


      try {

        sessionStorage.setItem(

          CONFIG.activeStorageKey,

          item.id

        );


        sessionStorage.setItem(

          CONFIG.indexStorageKey,

          String(currentIndex)

        );

      }

      catch (error) {}

    }


    /* =========================================================
       CREATE ACTIVE SHORT

       This is the ONLY place
       where a Short is created.

       Result:

       ONE SHORT
       ONE IFRAME
    ========================================================= */

    function createActiveShort(item) {

      const slide =
        document.createElement(
          "section"
        );


      slide.className =
        "short-slide";


      slide.dataset.id =
        item.id;


      /* =======================================================
         YOUTUBE IFRAME
      ======================================================= */

      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.className =
        "short-embed-frame";


      iframe.title =
        item.title ||
        "Short video";


      iframe.allow =

        "accelerometer; "

        +

        "autoplay; "

        +

        "clipboard-write; "

        +

        "encrypted-media; "

        +

        "gyroscope; "

        +

        "picture-in-picture";


      iframe.allowFullscreen =
        true;


      iframe.referrerPolicy =
        "strict-origin-when-cross-origin";


      /*
        Only the currently active Short
        receives an iframe and network request.
      */

      iframe.src =
        getEmbedURL(item);


      slide.appendChild(
        iframe
      );


      /* =======================================================
         ACTIONS BAR
      ======================================================= */

      const actions =
        document.createElement(
          "aside"
        );


      actions.className =
        "actions-bar";


      actions.innerHTML = `

        <button
          class="action-btn"
          type="button"
        >

          <div class="action-icon-wrapper">

            <svg viewBox="0 0 24 24">

              <path d="
                M1 21h4V9H1v12zm22-11
                c0-1.1-.9-2-2-2h-6.31
                l.95-4.57.03-.32
                c0-.41-.17-.79-.44-1.06
                L14.17 1 7.58 7.59
                C7.22 7.95 7 8.45 7 9
                v10c0 1.1.9 2 2 2h9
                c.83 0 1.54-.5 1.84-1.22
                l3.02-7.05
                c.09-.23.14-.47.14-.73
                v-2z
              "/>

            </svg>

          </div>

          <span>
            Like
          </span>

        </button>


        <button
          class="action-btn save-btn"
          type="button"
          data-id="${item.id}"
        >

          <div class="action-icon-wrapper">

            <svg viewBox="0 0 24 24">

              <path d="
                M17 3H7
                c-1.1 0-1.99.9-1.99 2
                L5 21l7-3 7 3V5
                c0-1.1-.9-2-2-2z
              "/>

            </svg>

          </div>

          <span class="save-text">
            Save
          </span>

        </button>


        <a
          href="${item.url}"
          target="_blank"
          rel="noopener noreferrer"
          class="action-btn"
        >

          <div class="action-icon-wrapper">

            <svg viewBox="0 0 24 24">

              <path d="
                M14 9v-4l7 7-7 7v-4.1
                c-5 0-8.5 1.6-11 5.1
                1-5 4-10 11-11z
              "/>

            </svg>

          </div>

          <span>
            Open
          </span>

        </a>

      `;


      slide.appendChild(
        actions
      );


      /* =======================================================
         BOTTOM INFORMATION
      ======================================================= */

      const information =
        document.createElement(
          "div"
        );


      information.className =
        "bottom-info";


      information.innerHTML = `

        <div class="creator-profile">

          <div class="creator-avatar"></div>


          <span class="creator-handle">

            ${item.creator || ""}

          </span>


          <button
            class="subscribe-btn"
            type="button"
          >

            Subscribe

          </button>

        </div>


        <p class="short-caption">

          ${item.title || ""}

        </p>

      `;


      const avatar =
        information.querySelector(
          ".creator-avatar"
        );


      if (avatar) {

        const avatarURL =

          item.creatorAvatar

          ||

          "https://picsum.photos/40/40";


        avatar.style.backgroundImage =

          `url("${avatarURL}")`;

      }


      slide.appendChild(
        information
      );


      /* =======================================================
         SAVE BUTTON
      ======================================================= */

      const saveBtn =
        slide.querySelector(
          ".save-btn"
        );


      const saveText =
        slide.querySelector(
          ".save-text"
        );


      /*
        Check whether this Short
        was previously saved.
      */

      isShortSaved(item.id)

        .then(

          saved => {

            if (

              saved

              &&

              slide.isConnected

            ) {

              saveBtn.classList.add(
                "saved"
              );


              saveText.textContent =
                "Saved";

            }

          }

        )

        .catch(
          () => {}
        );


      /* =======================================================
         LONG PRESS
      ======================================================= */

      let pressTimer =
        null;


      let isLongPressAction =
        false;


      const startPress =
        () => {

          isLongPressAction =
            false;


          if (pressTimer) {

            clearTimeout(
              pressTimer
            );

          }


          pressTimer =
            setTimeout(

              () => {

                isLongPressAction =
                  true;


                window.location.href =
                  "savedvideo.html";

              },

              400

            );

        };


      const cancelPress =
        () => {

          if (pressTimer) {

            clearTimeout(
              pressTimer
            );


            pressTimer =
              null;

          }

        };


      saveBtn.addEventListener(

        "mousedown",

        startPress

      );


      saveBtn.addEventListener(

        "touchstart",

        startPress,

        {
          passive: true
        }

      );


      saveBtn.addEventListener(

        "mousemove",

        cancelPress

      );


      saveBtn.addEventListener(

        "touchmove",

        cancelPress,

        {
          passive: true
        }

      );


      saveBtn.addEventListener(

        "mouseup",

        cancelPress

      );


      saveBtn.addEventListener(

        "mouseleave",

        cancelPress

      );


      saveBtn.addEventListener(

        "touchend",

        cancelPress

      );


      /* =======================================================
         NORMAL SAVE CLICK
      ======================================================= */

      saveBtn.addEventListener(

        "click",

        async event => {

          event.preventDefault();

          event.stopPropagation();


          if (isLongPressAction) {

            isLongPressAction =
              false;

            return;

          }


          const currentlySaved =

            saveBtn.classList.contains(
              "saved"
            );


          try {

            if (currentlySaved) {

              await removeShortFromDB(
                item.id
              );


              saveBtn.classList.remove(
                "saved"
              );


              saveText.textContent =
                "Save";

            }

            else {

              await saveShortToDB(
                item
              );


              saveBtn.classList.add(
                "saved"
              );


              saveText.textContent =
                "Saved";

            }

          }

          catch (error) {

            console.error(
              error
            );

          }


          isLongPressAction =
            false;

        }

      );


      return {

        slide,

        iframe

      };

    }


    /* =========================================================
       ACTIVATE SHORT

       1. Hard kill old Short
       2. Update virtual spacers
       3. Create ONE new Short
       4. Insert into DOM

       Result:
       ONE SHORT + ONE IFRAME
    ========================================================= */

    function activateShort(
      targetIndex,
      options = {}
    ) {

      if (

        !viewport

        ||

        !feed.length

      ) {
        return;
      }


      targetIndex =
        Math.max(

          0,

          Math.min(

            feed.length - 1,

            targetIndex

          )

        );


      if (isRendering) {
        return;
      }


      /*
        Already active.
      */

      if (

        activeSlide

        &&

        activeSlide.isConnected

        &&

        currentIndex === targetIndex

        &&

        !options.force

      ) {

        return;

      }


      isRendering =
        true;


      /* Hard kill previous Short */

      destroyActiveShort();


      currentIndex =
        targetIndex;


      /* Resize empty virtual areas */

      updateVirtualSpacers();


      const item =
        feed[currentIndex];


      if (!item) {

        isRendering =
          false;

        return;

      }


      /*
        Create exactly ONE Short.
      */

      const created =
        createActiveShort(
          item
        );


      activeSlide =
        created.slide;


      activeIframe =
        created.iframe;


      /*
        Insert active Short
        between top and bottom spacers.
      */

      viewport.insertBefore(

        activeSlide,

        bottomSpacer

      );


      saveCurrentState();


      /* =======================================================
         VIEW LOGGING
      ======================================================= */

      if (

        lastViewId !== item.id

      ) {

        lastViewId =
          item.id;


        if (

          typeof logInteraction ===
          "function"

        ) {

          queueMicrotask(

            () => {

              logInteraction(

                item.id,

                "view"

              );

            }

          );

        }

      }


      /* =======================================================
         SCROLL POSITION
      ======================================================= */

      if (!options.keepScroll) {

        const height =
          getViewportHeight();


        isProgrammaticScroll =
          true;


        viewport.scrollTop =

          currentIndex * height;


        requestAnimationFrame(

          () => {

            isProgrammaticScroll =
              false;

          }

        );

      }


      requestAnimationFrame(

        () => {

          isRendering =
            false;

        }

      );

    }


    /* =========================================================
       GET INDEX FROM SCROLL
    ========================================================= */

    function getIndexFromScroll() {

      const height =
        getViewportHeight();


      const index =

        viewport.scrollTop / height;


      return Math.max(

        0,

        Math.min(

          feed.length - 1,

          Math.round(index)

        )

      );

    }


    /* =========================================================
       SETTLE SCROLL

       Determines which virtual Short
       the user has reached.
    ========================================================= */

    function settleScroll() {

      if (

        isProgrammaticScroll

        ||

        !feed.length

      ) {

        return;

      }


      const targetIndex =
        getIndexFromScroll();


      if (

        targetIndex !== currentIndex

      ) {

        activateShort(
          targetIndex
        );

      }

      else {

        const height =
          getViewportHeight();


        isProgrammaticScroll =
          true;


        viewport.scrollTo({

          top:
            currentIndex * height,

          behavior:
            "smooth"

        });


        setTimeout(

          () => {

            isProgrammaticScroll =
              false;

          },

          250

        );

      }

    }


    /* =========================================================
       SCROLL EVENT
    ========================================================= */

    function onScroll() {

      if (isProgrammaticScroll) {
        return;
      }


      clearTimeout(
        scrollTimer
      );


      scrollTimer =
        setTimeout(

          settleScroll,

          CONFIG.scrollSettleDelay

        );

    }


    /* =========================================================
       TOUCH NAVIGATION
    ========================================================= */

    function onTouchStart(event) {

      if (!event.touches.length) {
        return;
      }


      touchStartY =
        event.touches[0].clientY;

    }


    function onTouchEnd(event) {

      if (!event.changedTouches.length) {
        return;
      }


      const endY =
        event.changedTouches[0].clientY;


      const difference =
        touchStartY - endY;


      if (

        Math.abs(difference)

        <

        CONFIG.minimumSwipeDistance

      ) {

        return;

      }


      if (difference > 0) {

        goNext();

      }

      else {

        goPrevious();

      }

    }


    /* =========================================================
       NEXT SHORT
    ========================================================= */

    function goNext() {

      if (

        currentIndex >=
        feed.length - 1

      ) {
        return;
      }


      activateShort(
        currentIndex + 1
      );

    }


    /* =========================================================
       PREVIOUS SHORT
    ========================================================= */

    function goPrevious() {

      if (currentIndex <= 0) {
        return;
      }


      activateShort(
        currentIndex - 1
      );

    }


    /* =========================================================
       MOUSE WHEEL NAVIGATION
    ========================================================= */

    let wheelLocked =
      false;


    function onWheel(event) {

      if (wheelLocked) {
        return;
      }


      if (

        Math.abs(event.deltaY)

        <

        20

      ) {
        return;
      }


      wheelLocked =
        true;


      if (event.deltaY > 0) {

        goNext();

      }

      else {

        goPrevious();

      }


      setTimeout(

        () => {

          wheelLocked =
            false;

        },

        350

      );

    }


    /* =========================================================
       KEYBOARD NAVIGATION
    ========================================================= */

    function onKeyDown(event) {

      if (

        event.key === "ArrowDown"

        ||

        event.key === "PageDown"

      ) {

        event.preventDefault();

        goNext();

      }


      if (

        event.key === "ArrowUp"

        ||

        event.key === "PageUp"

      ) {

        event.preventDefault();

        goPrevious();

      }

    }


    /* =========================================================
       BACKGROUND HARD KILL

       When the browser/tab is hidden:

       - iframe is destroyed
       - Short is removed

       This stops the embedded
       YouTube player from remaining
       active in the background.

       When the user returns:

       - only the current Short
         is recreated.
    ========================================================= */

    function suspendShort() {

      if (!activeSlide) {
        return;
      }


      suspendedIndex =
        currentIndex;


      destroyActiveShort();

    }


    /* =========================================================
       RESUME SHORT
    ========================================================= */

    function resumeShort() {

      if (
        suspendedIndex === null
      ) {
        return;
      }


      const restoreIndex =
        suspendedIndex;


      suspendedIndex =
        null;


      activateShort(

        restoreIndex,

        {
          force: true
        }

      );

    }


    /* =========================================================
       PAGE VISIBILITY
    ========================================================= */

    function onVisibilityChange() {

      if (document.hidden) {

        suspendShort();

      }

      else {

        resumeShort();

      }

    }


    /* =========================================================
       RESIZE OPTIMIZATION
    ========================================================= */

    function onResize() {

      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(

          () => {

            if (!viewport) {
              return;
            }


            updateVirtualSpacers();


            /*
              Keep the current
              virtual Short aligned
              with the viewport.
            */

            isProgrammaticScroll =
              true;


            viewport.scrollTop =

              currentIndex *

              getViewportHeight();


            requestAnimationFrame(

              () => {

                isProgrammaticScroll =
                  false;

              }

            );

          },

          100

        );

    }


    /* =========================================================
       ORIENTATION CHANGE
    ========================================================= */

    function onOrientationChange() {

      setTimeout(

        onResize,

        150

      );

    }


    /* =========================================================
       INITIALIZE VIRTUAL FEED

       The initial DOM contains:

       1. Top spacer
       2. Active Short
       3. Bottom spacer

       Only ONE actual Short
       exists in the DOM.
    ========================================================= */

    function initializeVirtualFeed() {

      if (!viewport) {
        return;
      }


      /*
        Remove everything currently
        inside the Shorts viewport.

        This removes the old system
        where every Short was
        inserted into the DOM.
      */

      viewport.replaceChildren();


      topSpacer =
        createSpacer();


      bottomSpacer =
        createSpacer();


      viewport.appendChild(
        topSpacer
      );


      viewport.appendChild(
        bottomSpacer
      );

    }


    /* =========================================================
       CLEANUP
    ========================================================= */

    function cleanup() {

      clearTimeout(
        scrollTimer
      );


      clearTimeout(
        resizeTimer
      );


      /*
        Save position before
        the page is destroyed.
      */

      saveCurrentState();


      /*
        Hard kill YouTube iframe.
      */

      destroyActiveShort();


      /*
        Remove references.
      */

      activeSlide =
        null;


      activeIframe =
        null;

    }


    /* =========================================================
       START APPLICATION
    ========================================================= */

    function startShorts() {

      viewport =
        document.getElementById(
          CONFIG.viewportId
        );


      if (!viewport) {

        console.warn(

          "Shorts viewport not found."

        );

        return;

      }


      /* =======================================================
         GET SHORTS FROM data.js

         data.js remains untouched.

         The entire mediaData array
         can remain exactly as it is.
      ======================================================= */

      feed =
        getFrozenSessionFeed();


      if (!feed.length) {

        console.warn(

          "No Shorts found in mediaData."

        );

        return;

      }


      /* =======================================================
         CREATE VIRTUAL STRUCTURE
      ======================================================= */

      initializeVirtualFeed();


      /*
        Determine which Short
        should be shown first.

        URL shared Short has
        highest priority.
      */

      currentIndex =
        getInitialIndex();


      /*
        Set virtual spacer sizes.
      */

      updateVirtualSpacers();


      /*
        Create exactly ONE Short.
      */

      requestAnimationFrame(

        () => {

          activateShort(

            currentIndex,

            {
              force: true
            }

          );

        }

      );


      /* =======================================================
         SCROLL LISTENER
      ======================================================= */

      viewport.addEventListener(

        "scroll",

        onScroll,

        {
          passive: true
        }

      );


      /* =======================================================
         TOUCH LISTENERS
      ======================================================= */

      viewport.addEventListener(

        "touchstart",

        onTouchStart,

        {
          passive: true
        }

      );


      viewport.addEventListener(

        "touchend",

        onTouchEnd,

        {
          passive: true
        }

      );


      /* =======================================================
         WHEEL LISTENER
      ======================================================= */

      viewport.addEventListener(

        "wheel",

        onWheel,

        {
          passive: true
        }

      );


      /* =======================================================
         KEYBOARD LISTENER
      ======================================================= */

      document.addEventListener(

        "keydown",

        onKeyDown

      );


      /* =======================================================
         BACKGROUND LISTENER
      ======================================================= */

      document.addEventListener(

        "visibilitychange",

        onVisibilityChange

      );


      /* =======================================================
         RESIZE LISTENER
      ======================================================= */

      window.addEventListener(

        "resize",

        onResize,

        {
          passive: true
        }

      );


      window.addEventListener(

        "orientationchange",

        onOrientationChange,

        {
          passive: true
        }

      );


      /* =======================================================
         PAGE EXIT

         pagehide is preferred because
         it also works better with
         mobile browser navigation.
      ======================================================= */

      window.addEventListener(

        "pagehide",

        cleanup,

        {
          passive: true
        }

      );

    }


    /* =========================================================
       DOM READY
    ========================================================= */

    if (

      document.readyState ===
      "loading"

    ) {

      document.addEventListener(

        "DOMContentLoaded",

        startShorts,

        {
          once: true
        }

      );

    }

    else {

      startShorts();

    }


    /* =========================================================
       PERFORMANCE DEBUG API

       Optional console commands:


       ShortPerformance.next()

       ShortPerformance.previous()

       ShortPerformance.goToId("s5")

       ShortPerformance.getState()


       IMPORTANT:

       domShorts should normally be:

       1

       domIframes should normally be:

       1


       This confirms that:

       - Only one Short exists.
       - Only one YouTube iframe exists.
       - Other Shorts are NOT
         hidden in the DOM.
    ========================================================= */

    window.ShortPerformance = {


      /* =====================================================
         NEXT
      ===================================================== */

      next() {

        goNext();

      },


      /* =====================================================
         PREVIOUS
      ===================================================== */

      previous() {

        goPrevious();

      },


      /* =====================================================
         GO TO SPECIFIC ID
      ===================================================== */

      goToId(id) {

        const index =
          feed.findIndex(

            item =>

              item.id === id

          );


        if (index >= 0) {

          activateShort(
            index
          );

        }

      },


      /* =====================================================
         CURRENT STATE
      ===================================================== */

      getState() {

        return {

          activeId:

            feed[currentIndex]?.id

            ||

            null,


          currentIndex:


            currentIndex,


          totalShorts:


            feed.length,


          /*
            Actual Short elements
            currently inside DOM.
          */

          domShorts:

            viewport

              ?.querySelectorAll(
                ".short-slide"
              )

              .length

            ||

            0,


          /*
            Actual YouTube players
            currently inside DOM.
          */

          domIframes:

            viewport

              ?.querySelectorAll(
                "iframe"
              )

              .length

            ||

            0,


          /*
            Whether browser page
            is currently hidden.
          */

          pageHidden:

            document.hidden

        };

      },


      /* =====================================================
         FORCE DESTROY
      ===================================================== */

      destroy() {

        cleanup();

      }

    };


    /* =========================================================
       FINAL OPTIMIZATION NOTES

       THIS SYSTEM ENSURES:

       ✓ Only ONE Short is rendered.

       ✓ Only ONE YouTube iframe exists.

       ✓ Previous iframe is hard killed.

       ✓ Previous iframe src becomes
         about:blank before removal.

       ✓ Previous Short is removed.

       ✓ Other Shorts are never inserted
         into the DOM.

       ✓ Virtual spacers simulate the
         full scrollable feed.

       ✓ Scrolling changes the active
         Short dynamically.

       ✓ Background tabs hard kill
         the active iframe.

       ✓ Returning recreates only
         the current Short.

       ✓ data.js remains unchanged.

       ✓ Shared links can start from
         a specific Short.

       ✓ Saved Shorts logic remains
         compatible with IndexedDB.

       ✓ Session position is preserved.

       ========================================================= */


  </script>


  <!--
    Universal sharing logic.

    This can generate URLs like:

    shorts.html?short=s1

    or:

    shorts.html?short=s11
  -->

  <script src="universalshorts.js"></script>


</body>

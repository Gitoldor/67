<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Videos - YouTube Shell</title>

  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #212121;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-red: #ff0000;
      --pill-bg: #272727;
      --pill-active-bg: #ffffff;
      --pill-active-text: #0f0f0f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      height: 48px;
      position: relative;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 28px;
      height: 20px;
      background-color: var(--accent-red);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon::after {
      content: '';
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid white;
      margin-left: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Filter & Navigation Chips Carousel */
    .carousel-container {
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--bg-color);
      padding: 6px 0;
    }

    .sticky-compass {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: var(--bg-color);
      padding: 0 8px 0 12px;
      display: flex;
      align-items: center;
    }

    .compass-btn {
      background-color: var(--pill-bg);
      border-radius: 8px;
      width: 34px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-right: 12px;
      scrollbar-width: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .nav-chip {
      background-color: var(--pill-bg);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      text-decoration: none;
    }

    .nav-chip.active {
      background-color: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    .nav-chip svg {
      width: 16px;
      height: 16px;
    }

    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      scrollbar-width: none;
    }

    .feed::-webkit-scrollbar {
      display: none;
    }

    /* Section Folders Header */
    .folder-section {
      margin-bottom: 24px;
    }

    .folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .folder-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-all-btn {
      background: none;
      border: none;
      color: #3ea6ff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Sub-view Top Header for Full List Display */
    .subview-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 0;
      color: var(--text-sub);
      text-align: center;
      gap: 8px;
      font-size: 13px;
    }

    /* 1x2 Grid Layout for Shorts */
    .shorts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .short-card {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 12px;
      overflow: hidden;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
      background-size: cover;
      background-position: center;
      text-decoration: none;
      cursor: pointer;
    }

    .short-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.85) 100%
      );
    }

    .card-bottom {
      position: relative;
      z-index: 1;
      font-size: 12px;
      font-weight: 600;
      color: white;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Long-Form Video Card Layout */
    .video-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .video-thumbnail-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }

    /* Save Bookmark Button */
    .save-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      z-index: 5;
      transition: background 0.2s, transform 0.15s;
    }

    .save-btn:active {
      transform: scale(0.9);
    }

    .save-btn.saved {
      background: var(--text-main);
      color: var(--bg-color);
    }

    .video-meta {
      display: flex;
      gap: 10px;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .video-details {
      display: flex;
      flex-direction: column;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-subtext {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }
  </style>
</head>

<body>

  <div class="app-container">

    <header class="header">

      <a href="index.html" class="brand">
        <div class="brand-icon"></div>
        <span>YouTube</span>
      </a>

      <div class="header-actions">

        <svg

            <svg

  <script src="data.js"></script>


  <script>

    // ============================================================
    // PRIMARY ANALYTICS DB CONNECTION
    // ============================================================

    function getAnalyticsDB() {

      return new Promise((resolve, reject) => {

        const request = indexedDB.open("AnalyticsDB", 3);

        request.onupgradeneeded = (e) => {

          const db = e.target.result;

          if (!db.objectStoreNames.contains("interactions")) {

            db.createObjectStore(
              "interactions",
              {
                keyPath: "id",
                autoIncrement: true
              }
            );

          }

          if (!db.objectStoreNames.contains("bookmarks")) {

            db.createObjectStore(
              "bookmarks",
              {
                keyPath: "mediaId"
              }
            );

          }

        };

        request.onsuccess = (e) => resolve(e.target.result);

        request.onerror = (e) => reject(e.target.error);

      });

    }


    // ============================================================
    // SECONDARY SHORTS APP DB CONNECTION
    // ============================================================

    function getShortsDB() {

      return new Promise((resolve, reject) => {

        const request = indexedDB.open("ShortsAppDB", 1);

        request.onupgradeneeded = (e) => {

          const db = e.target.result;

          if (!db.objectStoreNames.contains("saved_shorts")) {

            db.createObjectStore(
              "saved_shorts",
              {
                keyPath: "id"
              }
            );

          }

        };

        request.onsuccess = (e) => resolve(e.target.result);

        request.onerror = (e) => reject(e.target.error);

      });

    }


    // ============================================================
    // RETRIEVE SAVED BOOKMARKS FROM ANALYTICS DB
    // ============================================================

    async function fetchAnalyticsBookmarks() {

      try {

        const db = await getAnalyticsDB();

        return new Promise((resolve) => {

          const tx = db.transaction(
            "bookmarks",
            "readonly"
          );

          const store = tx.objectStore("bookmarks");

          const getAll = store.getAll();

          getAll.onsuccess = () => {

            resolve(
              getAll.result || []
            );

          };

          getAll.onerror = () => {

            resolve([]);

          };

        });

      } catch (err) {

        return [];

      }

    }


    // ============================================================
    // RETRIEVE SAVED SHORTS
    // ============================================================

    async function fetchShortsBookmarksDB() {

      try {

        const db = await getShortsDB();

        return new Promise((resolve) => {

          const tx = db.transaction(
            "saved_shorts",
            "readonly"
          );

          const store = tx.objectStore(
            "saved_shorts"
          );

          const getAll = store.getAll();

          getAll.onsuccess = () => {

            resolve(
              getAll.result || []
            );

          };

          getAll.onerror = () => {

            resolve([]);

          };

        });

      } catch (err) {

        return [];

      }

    }


    // ============================================================
    // REMOVE SAVED BOOKMARK
    // ============================================================

    async function removeSaveDB(id) {

      try {

        const dbAnalytics =
          await getAnalyticsDB();

        const txA =
          dbAnalytics.transaction(
            "bookmarks",
            "readwrite"
          );

        txA
          .objectStore("bookmarks")
          .delete(id);


        const dbShorts =
          await getShortsDB();

        const txS =
          dbShorts.transaction(
            "saved_shorts",
            "readwrite"
          );

        txS
          .objectStore("saved_shorts")
          .delete(id);

      } catch (err) {

        console.error(
          "Failed to remove bookmark from IndexedDB",
          err
        );

      }

    }


    // ============================================================
    // LOG INTERACTION
    // ============================================================

    async function logInteraction(
      mediaId,
      type
    ) {

      try {

        const db =
          await getAnalyticsDB();

        const tx =
          db.transaction(
            "interactions",
            "readwrite"
          );

        tx
          .objectStore("interactions")
          .add({
            mediaId: mediaId,
            type: type,
            timestamp: new Date().toISOString()
          });

      } catch (err) {

        console.error(
          "Failed to log interaction",
          err
        );

      }

    }


    // ============================================================
    // YOUTUBE THUMBNAIL
    // URL IS USED ONLY FOR THUMBNAIL
    // ============================================================

    function getThumbnailFromUrl(
      urlString
    ) {

      if (!urlString) {

        return 'https://picsum.photos/400/225';

      }

      let videoId = '';


      if (urlString.includes('/shorts/')) {

        videoId =
          urlString
            .split('/shorts/')[1];

      }

      else if (urlString.includes('v=')) {

        videoId =
          urlString
            .split('v=')[1]
            .split('&')[0];

      }

      else {

        videoId =
          urlString
            .split('/')
            .pop();

      }


      return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

    }


    // ============================================================
    // SAVED VIDEO CARD
    // ============================================================

    function createVideoCardElement(
      item,
      onRemove
    ) {

      const card =
        document.createElement('a');


      // ========================================================
      // IMPORTANT:
      // href = CLICK DESTINATION
      // url  = THUMBNAIL SOURCE
      // ========================================================

      card.href =
        item.href ||
        item.url ||
        '#';


      card.className =
        'video-card';


      card.setAttribute(
        'data-id',
        item.id
      );


      card.innerHTML = `

        <div
          class="video-thumbnail-box"
          style="background-image: url('${getThumbnailFromUrl(item.url)}')"
        >

          <button
            class="save-btn saved"
            data-id="${item.id}"
          >

            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
            >

              <path
                d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"
              ></path>

            </svg>

          </button>

        </div>


        <div class="video-meta">

          <div
            class="channel-avatar"
            style="background-image: url('${item.creatorAvatar || 'https://picsum.photos/40/40'}')"
          ></div>


          <div class="video-details">

            <span class="video-title">
              ${item.title || 'Untitled Video'}
            </span>

            <span class="video-subtext">
              ${item.creator || 'Creator'} • Saved Video
            </span>

          </div>

        </div>

      `;


      card.addEventListener(
        'click',
        (e) => {

          if (
            e.target.closest('.save-btn')
          ) {

            return;

          }

          logInteraction(
            item.id,
            'click'
          );

        }
      );


      const saveBtn =
        card.querySelector(
          '.save-btn'
        );


      saveBtn.addEventListener(
        'click',
        async (e) => {

          e.preventDefault();

          e.stopPropagation();


          await removeSaveDB(
            item.id
          );


          if (onRemove) {

            onRemove(
              item.id
            );

          }

        }
      );


      return card;

    }


    // ============================================================
    // SAVED SHORT CARD
    // ============================================================

    function createShortCardElement(
      item,
      onRemove
    ) {

      const shortCard =
        document.createElement('a');


      // ========================================================
      // IMPORTANT:
      // href = CLICK DESTINATION
      // url  = THUMBNAIL SOURCE
      // ========================================================

      shortCard.href =
        item.href ||
        item.url ||
        `shorts.html?id=${item.id}`;


      shortCard.className =
        'short-card';


      shortCard.setAttribute(
        'data-id',
        item.id
      );


      shortCard.style.backgroundImage =
        `url('${getThumbnailFromUrl(item.url)}')`;


      shortCard.innerHTML = `

        <button
          class="save-btn saved"
          data-id="${item.id}"
        >

          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
          >

            <path
              d="M19 21l-7-5-7 5V5a2 2 0 0 1 2 2h10a2 2 0 0 1 2 2z"
            ></path>

          </svg>

        </button>


        <div class="card-bottom">

          ${item.title || 'Short'}

        </div>

      `;


              shortCard.addEventListener(
          'click',
          (e) => {

            if (
              e.target.closest('.save-btn')
            ) {

              return;

            }

            logInteraction(
              item.id,
              'click'
            );

          }
        );


        const saveBtn =
          shortCard.querySelector(
            '.save-btn'
          );


        saveBtn.addEventListener(
          'click',
          async (e) => {

            e.preventDefault();

            e.stopPropagation();


            await removeSaveDB(
              item.id
            );


            if (onRemove) {

              onRemove(
                item.id
              );

            }

          }
        );


        return shortCard;

      }


      // ============================================================
      // MAIN
      // ============================================================

      document.addEventListener(
        "DOMContentLoaded",
        async () => {

          const feed =
            document.getElementById(
              "saved-feed"
            );


          // ======================================================
          // EXTRACT RAW DATA SAFELY FROM WINDOW
          // ======================================================

          const rawMedia =
            (
              typeof mediaData !== 'undefined' &&
              Array.isArray(mediaData)
            )
              ? mediaData
              : [];


          // ======================================================
          // LOAD IDS / OBJECTS FROM INDEXEDDB
          // ======================================================

          const analyticsBookmarks =
            await fetchAnalyticsBookmarks();


          const shortsAppBookmarks =
            await fetchShortsBookmarksDB();


          // ======================================================
          // CONSOLIDATE BOOKMARK MAP
          // ======================================================

          const bookmarkedIds =
            new Set([
              ...analyticsBookmarks.map(
                b => b.mediaId || b.id
              ),

              ...shortsAppBookmarks.map(
                b => b.id || b.mediaId
              )
            ]);


          // ======================================================
          // MAP DB BOOKMARK IDS BACK TO COMPLETE OBJECTS
          // ======================================================

          let savedVideos = [];

          let savedShorts = [];


          bookmarkedIds.forEach(
            (id) => {

              if (!id) {

                return;

              }


              const matchedItem =
                rawMedia.find(
                  m => m.id === id
                );


              if (matchedItem) {

                if (
                  matchedItem.type === 'shorts'
                ) {

                  savedShorts.push(
                    matchedItem
                  );

                }

                else {

                  savedVideos.push(
                    matchedItem
                  );

                }

              }

              else {

                // Object stored directly in IndexedDB fallback

                const directShort =
                  shortsAppBookmarks.find(
                    s =>
                      (s.id || s.mediaId) === id
                  );


                if (directShort) {

                  savedShorts.push({

                    id:
                      directShort.id || id,

                    type:
                      'shorts',

                    title:
                      directShort.title ||
                      'Saved Short',

                    url:
                      directShort.url || '',

                    href:
                      directShort.href || ''

                  });

                }

              }

            }
          );


          // ======================================================
          // DASHBOARD VIEW
          // ======================================================

          function renderDashboard() {

            feed.innerHTML = '';


            // ==================================================
            // FOLDER 1: VIDEOS
            // ==================================================

            const videoSection =
              document.createElement(
                'section'
              );


            videoSection.className =
              'folder-section';


            const videoHeader =
              document.createElement(
                'div'
              );


            videoHeader.className =
              'folder-header';


            videoHeader.innerHTML = `

              <div class="folder-title">

                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >

                  <path
                    d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1.9-2-2-2zm-10 7V9l5 3-5 3z"
                  />

                </svg>

                <span>
                  Saved Videos
                </span>

              </div>

            `;


            if (
              savedVideos.length > 0
            ) {

              const viewAllVidBtn =
                document.createElement(
                  'button'
                );


              viewAllVidBtn.className =
                'view-all-btn';


              viewAllVidBtn.textContent =
                'View All';


              viewAllVidBtn.addEventListener(
                'click',
                renderAllVideosView
              );


              videoHeader.appendChild(
                viewAllVidBtn
              );

            }


            videoSection.appendChild(
              videoHeader
            );


            if (
              savedVideos.length === 0
            ) {

              videoSection.innerHTML += `

                <div class="empty-state">

                  <p>
                    No saved videos
                  </p>

                </div>

              `;

            }

            else {

              const mostRecentVid =
                savedVideos[
                  savedVideos.length - 1
                ];


              videoSection.appendChild(

                createVideoCardElement(
                  mostRecentVid,
                  (id) => {

                    savedVideos =
                      savedVideos.filter(
                        v => v.id !== id
                      );


                    renderDashboard();

                  }
                )

              );

            }


            feed.appendChild(
              videoSection
            );


            // ==================================================
            // FOLDER 2: SHORTS
            // ==================================================

            const shortsSection =
              document.createElement(
                'section'
              );


            shortsSection.className =
              'folder-section';


            const shortsHeader =
              document.createElement(
                'div'
              );


            shortsHeader.className =
              'folder-header';


            shortsHeader.innerHTML = `

              <div class="folder-title">

                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >

                  <path
                    d="M17.77 10.32l-1.2-.5L18 8.6a3.6 3.6 0 00-1.87-6.75 3.58 3.58 0 00-1.63.4l-6.8 3.88a3.6 3.6 0 001.27 6.75l1.2.5L8 14.6a3.6 3.6 0 001.87 6.75c.56 0 1.1-.14 1.63-.4l6.8-3.88a3.6 3.6 0 00-1.27-6.75z"
                  />

                </svg>

                <span>
                  Saved Shorts
                </span>

              </div>

            `;


            if (
              savedShorts.length > 0
            ) {

              const viewAllShortsBtn =
                document.createElement(
                  'button'
                );


              viewAllShortsBtn.className =
                'view-all-btn';


              viewAllShortsBtn.textContent =
                'View All';


              viewAllShortsBtn.addEventListener(
                'click',
                renderAllShortsView
              );


              shortsHeader.appendChild(
                viewAllShortsBtn
              );

            }


            shortsSection.appendChild(
              shortsHeader
            );


            if (
              savedShorts.length === 0
            ) {

              shortsSection.innerHTML += `

                <div class="empty-state">

                  <p>
                    No saved shorts
                  </p>

                </div>

              `;

            }

            else {

              const grid =
                document.createElement(
                  'div'
                );


              grid.className =
                'shorts-grid';


              const topShorts =
                savedShorts.slice(
                  0,
                  2
                );


              topShorts.forEach(
                item => {

                  grid.appendChild(

                    createShortCardElement(
                      item,
                      (id) => {

                        savedShorts =
                          savedShorts.filter(
                            s => s.id !== id
                          );


                        renderDashboard();

                      }
                    )

                  );

                }
              );


              shortsSection.appendChild(
                grid
              );

            }


            feed.appendChild(
              shortsSection
            );

          }


          // ======================================================
          // ALL VIDEOS VIEW
          // ======================================================

          function renderAllVideosView() {

            feed.innerHTML = '';


            const subheader =
              document.createElement(
                'div'
              );


            subheader.className =
              'subview-header';


            subheader.innerHTML = `

              <button
                class="back-btn"
                aria-label="Back"
              >

                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >

                  <polyline
                    points="15 18 9 12 15 6"
                  ></polyline>

                </svg>

              </button>


              <div class="folder-title">

                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >

                  <path
                    d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7V9l5 3-5 3z"
                  />

                </svg>

                <span>
                  Saved Videos
                </span>

              </div>

            `;


            subheader
              .querySelector(
                '.back-btn'
              )
              .addEventListener(
                'click',
                renderDashboard
              );


            feed.appendChild(
              subheader
            );


            if (
              savedVideos.length === 0
            ) {

              feed.innerHTML += `

                <div class="empty-state">

                  <p>
                    No saved videos
                  </p>

                </div>

              `;

              return;

            }


            savedVideos
              .slice()
              .reverse()
              .forEach(
                item => {

                  feed.appendChild(

                    createVideoCardElement(
                      item,
                      (id) => {

                        savedVideos =
                          savedVideos.filter(
                            v => v.id !== id
                          );


                        renderAllVideosView();

                      }
                    )

                  );

                }
              );

          }


          // ======================================================
          // ALL SHORTS VIEW
          // ======================================================

          function renderAllShortsView() {

            feed.innerHTML = '';


            const subheader =
              document.createElement(
                'div'
              );


            subheader.className =
              'subview-header';


            subheader.innerHTML = `

              <button
                class="back-btn"
                aria-label="Back"
              >

                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >

                  <polyline
                    points="15 18 9 12 15 6"
                  ></polyline>

                </svg>

              </button>


              <div class="folder-title">

                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >

                  <path
                    d="M17.77 10.32l-1.2-.5L18 8.6a3.6 3.6 0 00-1.87-6.75 3.58 3.58 0 00-1.63.4l-6.8 3.88a3.6 3.6 0 001.27 6.75l1.2.5L8 14.6a3.6 3.6 0 001.87 6.75c.56 0 1.1-.14 1.63-.4l6.8-3.88a3.6 3.6 0 00-1.27-6.75z"
                  />

                </svg>

                <span>
                  Saved Shorts
                </span>

              </div>

            `;


            subheader
              .querySelector(
                '.back-btn'
              )
              .addEventListener(
                'click',
                renderDashboard
              );


            feed.appendChild(
              subheader
            );


            if (
              savedShorts.length === 0
            ) {

              feed.innerHTML += `

                <div class="empty-state">

                  <p>
                    No saved shorts
                  </p>

                </div>

              `;

              return;

            }


            const grid =
              document.createElement(
                'div'
              );


            grid.className =
              'shorts-grid';


            savedShorts
              .slice()
              .reverse()
              .forEach(
                item => {

                  grid.appendChild(

                    createShortCardElement(
                      item,
                      (id) => {

                        savedShorts =
                          savedShorts.filter(
                            s => s.id !== id
                          );


                        renderAllShortsView();

                      }
                    )

                  );

                }
              );


            feed.appendChild(
              grid
            );

          }


          // ======================================================
          // INITIAL RENDER
          // ======================================================

          renderDashboard();

        }
      );

  </script>

</body>
</html>

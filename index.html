<!DOCTYPE html>
<html lang="en">
<head>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yd2f29lf1m");
  </script>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YouTube Mobile Shell</title>

  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #212121;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-red: #ff0000;
      --pill-bg: #272727;
      --pill-active-bg: #ffffff;
      --pill-active-text: #0f0f0f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      height: 48px;
      position: relative;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 28px;
      height: 20px;
      background-color: var(--accent-red);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon::after {
      content: '';
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid white;
      margin-left: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .notification-badge {
      position: relative;
      cursor: pointer;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background-color: var(--accent-red);
      color: white;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 8px;
    }

    /* Filter & Navigation Chips Carousel */

    .carousel-container {
      position: relative;
      display: flex;
      align-items: center;
      background-color: var(--bg-color);
      padding: 6px 0;
    }

    .sticky-compass {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: var(--bg-color);
      padding: 0 8px 0 12px;
      display: flex;
      align-items: center;
    }

    .compass-btn {
      background-color: var(--pill-bg);
      border-radius: 8px;
      width: 34px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-right: 12px;
      scrollbar-width: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .nav-chip {
      background-color: var(--pill-bg);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      text-decoration: none;
    }

    .nav-chip.active {
      background-color: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    .nav-chip svg {
      width: 16px;
      height: 16px;
    }

    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      scrollbar-width: none;
    }

    .feed::-webkit-scrollbar {
      display: none;
    }

    /* Shorts Grid Layout */

    .shorts-section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 12px 0 8px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shorts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .short-card {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 12px;
      overflow: hidden;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
      background-size: cover;
      background-position: center;
      text-decoration: none;
      cursor: pointer;
    }

    .short-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.85) 100%
      );
    }

    .card-bottom {
      position: relative;
      z-index: 1;
      font-size: 12px;
      font-weight: 600;
      color: white;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Long-Form Video Card Layout */

    .video-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .video-thumbnail-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }

    /* Save Bookmark Button */

    .save-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      z-index: 5;
      transition: background 0.2s, transform 0.15s;
    }

    .save-btn:active {
      transform: scale(0.9);
    }

    .save-btn.saved {
      background: var(--text-main);
      color: var(--bg-color);
    }

    .video-meta {
      display: flex;
      gap: 10px;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .video-details {
      display: flex;
      flex-direction: column;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-subtext {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .sentinel {
      height: 40px;
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="app-container">

    <header class="header">

      <a href="index.html" class="brand">

  <script src="data.js"></script>


  <script>

    function getAnalyticsDB() {

      return new Promise((resolve, reject) => {

        const request = indexedDB.open("AnalyticsDB", 3);

        request.onupgradeneeded = (e) => {

          const db = e.target.result;

          if (!db.objectStoreNames.contains("interactions")) {

            db.createObjectStore(
              "interactions",
              {
                keyPath: "id",
                autoIncrement: true
              }
            );

          }

          if (!db.objectStoreNames.contains("bookmarks")) {

            db.createObjectStore(
              "bookmarks",
              {
                keyPath: "mediaId"
              }
            );

          }

        };

        request.onsuccess = (e) => resolve(e.target.result);

        request.onerror = (e) => reject(e.target.error);

      });

    }


    async function logInteraction(mediaId, type) {

      try {

        const db = await getAnalyticsDB();

        const tx = db.transaction(
          "interactions",
          "readwrite"
        );

        tx.objectStore("interactions").add({

          mediaId: mediaId,
          type: type,
          timestamp: new Date().toISOString()

        });

      } catch (err) {

        console.error(
          "Failed to log interaction",
          err
        );

      }

    }


    async function toggleBookmarkInDB(mediaId) {

      try {

        const db = await getAnalyticsDB();

        const tx = db.transaction(
          "bookmarks",
          "readwrite"
        );

        const store = tx.objectStore("bookmarks");

        return new Promise((resolve) => {

          const checkReq = store.get(mediaId);

          checkReq.onsuccess = () => {

            if (checkReq.result) {

              store.delete(mediaId);

              logInteraction(
                mediaId,
                'bookmark_removed'
              );

              resolve(false);

            } else {

              store.put({

                mediaId: mediaId,
                timestamp: new Date().toISOString()

              });

              logInteraction(
                mediaId,
                'bookmark_added'
              );

              resolve(true);

            }

          };

        });

      } catch (err) {

        console.error(
          "Failed to update bookmark",
          err
        );

        return false;

      }

    }


    async function getSavedBookmarks() {

      try {

        const db = await getAnalyticsDB();

        return new Promise((resolve) => {

          const tx = db.transaction(
            "bookmarks",
            "readonly"
          );

          const store = tx.objectStore("bookmarks");

          const getAll = store.getAll();

          getAll.onsuccess = () => {

            resolve(
              (getAll.result || [])
                .map(b => b.mediaId)
            );

          };

          getAll.onerror = () => resolve([]);

        });

      } catch (err) {

        return [];

      }

    }


    function getThumbnailFromUrl(urlString) {

      if (!urlString) {
        return 'https://picsum.photos/400/225';
      }

      let videoId = '';

      if (urlString.includes('/shorts/')) {

        videoId =
          urlString
            .split('/shorts/')[1];

      } else if (urlString.includes('v=')) {

        videoId =
          urlString
            .split('v=')[1]
            .split('&')[0];

      } else {

        videoId =
          urlString
            .split('/')
            .pop();

      }

      return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

    }


    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        const mainFeed =
          document.getElementById("main-feed");

        const sentinel =
          document.getElementById("sentinel");


        const dataset =
          (
            typeof mediaData !== 'undefined' &&
            Array.isArray(mediaData)
          )
            ? mediaData
            : [];


        const savedIds =
          new Set(
            await getSavedBookmarks()
          );


        const videos =
          dataset.filter(
            item => item.type === 'video'
          );


        const shorts =
          dataset.filter(
            item => item.type === 'shorts'
          );


        let videoIndex = 0;

        let shortsIndex = 0;

        let stage = 0;

        let isLoading = false;


        /*
        ========================================================
        VIDEO CARD
        ========================================================
        */

        function createVideoCard(item) {

          const card =
            document.createElement('a');


          /*
          IMPORTANT:

          item.href = where the card goes.

          item.url = still used for the
          YouTube thumbnail below.
          */

          card.href =
            item.href ||
            item.url ||
            '#';


          card.className =
            'video-card';


          card.setAttribute(
            'data-id',
            item.id
          );


          const isSaved =
            savedIds.has(item.id);


          card.innerHTML = `

            <div
              class="video-thumbnail-box"
              style="background-image: url('${getThumbnailFromUrl(item.url)}')"
            >

              <button
                class="save-btn ${isSaved ? 'saved' : ''}"
                data-id="${item.id}"
              >

                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="${isSaved ? 'currentColor' : 'none'}"
                  stroke="currentColor"
                  stroke-width="2"
                >

                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>

                </svg>

              </button>

            </div>


            <div class="video-meta">

              <div
                class="channel-avatar"
                style="background-image: url('${item.creatorAvatar || 'https://picsum.photos/40/40'}')"
              ></div>


              <div class="video-details">

                <span class="video-title">
                  ${item.title}
                </span>

                <span class="video-subtext">
                  ${item.creator || 'Creator'} • 12K views • 2 days ago
                </span>

              </div>

            </div>

          `;


          card.addEventListener(
            'click',
            (e) => {

              if (
                e.target.closest('.save-btn')
              ) {
                return;
              }

              logInteraction(
                item.id,
                'click'
              );

            }
          );


          const saveBtn =
            card.querySelector('.save-btn');


          saveBtn.addEventListener(
            'click',
            async (e) => {

              e.preventDefault();

              e.stopPropagation();


              const activeState =
                await toggleBookmarkInDB(
                  item.id
                );


              saveBtn.classList.toggle(
                'saved',
                activeState
              );


              saveBtn
                .querySelector('svg')
                .setAttribute(
                  'fill',
                  activeState
                    ? 'currentColor'
                    : 'none'
                );


              if (activeState) {

                savedIds.add(
                  item.id
                );

              } else {

                savedIds.delete(
                  item.id
                );

              }

            }
          );


          return card;

        }


        /*
        ========================================================
        SHORTS
        ========================================================
        */

        function createShortsGridSection(
          shortsChunk
        ) {

          const section =
            document.createElement('div');


          const sectionHeader = `

            <div class="shorts-section-title">

              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="#FF0000"
              >

                <path d="M17.77 10.32l-1.2-.5L18 8.6a3.6 3.6 0 00-1.87-6.75 3.58 3.58 0 00-1.63.4l-6.8 3.88a3.6 3.6 0 001.27 6.75l1.2.5L8 14.6a3.6 3.6 0 001.87 6.75c.56 0 1.1-.14 1.63-.4l6.8-3.88a3.6 3.6 0 00-1.27-6.75z"/>

              </svg>

              <span>Shorts</span>

            </div>

          `;


          const grid =
            document.createElement('div');


          grid.className =
            'shorts-grid';


          shortsChunk.forEach(
            item => {

              const shortCard =
                document.createElement('a');


              /*
              Shorts continue to use
              shorts2.html?id=...
              */

              shortCard.href =
                `shorts2.html?id=${item.id}`;


              shortCard.className =
                'short-card';


                            /*
              Shorts continue to use
              shorts2.html?id=...
              */

              shortCard.href =
                `shorts2.html?id=${item.id}`;


              shortCard.className =
                'short-card';


              shortCard.setAttribute(
                'data-id',
                item.id
              );


              shortCard.style.backgroundImage =
                `url('${getThumbnailFromUrl(item.url)}')`;


              shortCard.innerHTML =
                `<div class="card-bottom">${item.title}</div>`;


              shortCard.addEventListener(
                'click',
                () => {

                  logInteraction(
                    item.id,
                    'click'
                  );

                }
              );


              grid.appendChild(
                shortCard
              );

            }
          );


          section.innerHTML =
            sectionHeader;


          section.appendChild(
            grid
          );


          return section;

        }


        /*
        ========================================================
        VIEW TRACKING
        ========================================================
        */

        const viewObserver =
          new IntersectionObserver(
            (entries) => {

              entries.forEach(
                entry => {

                  if (
                    entry.isIntersecting
                  ) {

                    const id =
                      entry.target
                        .getAttribute(
                          'data-id'
                        );


                    if (id) {

                      logInteraction(
                        id,
                        'view'
                      );

                    }

                  }

                }
              );

            },
            {
              threshold: 0.5
            }
          );


        /*
        ========================================================
        INFINITE FEED
        ========================================================
        */

        function loadNextBatch() {

          if (isLoading) {
            return;
          }


          if (
            videoIndex >= videos.length &&
            shortsIndex >= shorts.length
          ) {

            sentinelObserver.disconnect();

            sentinel.remove();

            return;

          }


          isLoading = true;


          if (stage === 0) {

            if (
              videoIndex < videos.length
            ) {

              const v =
                videos[videoIndex++];


              const node =
                createVideoCard(v);


              mainFeed.insertBefore(
                node,
                sentinel
              );


              viewObserver.observe(
                node
              );

            }


            stage = 1;

          }


          else if (stage === 1) {

            const chunk =
              shorts.slice(
                shortsIndex,
                shortsIndex + 6
              );


            if (chunk.length > 0) {

              shortsIndex +=
                chunk.length;


              const gridNode =
                createShortsGridSection(
                  chunk
                );


              mainFeed.insertBefore(
                gridNode,
                sentinel
              );


              gridNode
                .querySelectorAll(
                  '.short-card'
                )
                .forEach(
                  sc =>
                    viewObserver.observe(sc)
                );

            }


            stage = 2;

          }


          else if (stage === 2) {

            const chunk =
              videos.slice(
                videoIndex,
                videoIndex + 4
              );


            if (chunk.length > 0) {

              videoIndex +=
                chunk.length;


              chunk.forEach(
                v => {

                  const node =
                    createVideoCard(v);


                  mainFeed.insertBefore(
                    node,
                    sentinel
                  );


                  viewObserver.observe(
                    node
                  );

                }
              );

            }


            stage = 1;

          }


          isLoading = false;

        }


        /*
        ========================================================
        SENTINEL OBSERVER
        ========================================================
        */

        const sentinelObserver =
          new IntersectionObserver(
            (entries) => {

              if (
                entries[0].isIntersecting &&
                !isLoading
              ) {

                loadNextBatch();


                if (
                  mainFeed.scrollHeight <=
                  mainFeed.clientHeight + 100
                ) {

                  loadNextBatch();

                }

              }

            },
            {
              root: mainFeed,
              rootMargin: '150px'
            }
          );


        sentinelObserver.observe(
          sentinel
        );

      }
    );

  </script>
